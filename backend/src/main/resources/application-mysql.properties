# MySQL — activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Set MYSQL_URL, MYSQL_USERNAME, MYSQL_PASSWORD in the environment (do not commit real values).
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/restaurant_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
