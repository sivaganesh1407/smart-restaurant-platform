# Server
server.port=8080

# Default: H2 in-memory — runs with no external database (clone-and-run friendly)
spring.datasource.url=jdbc:h2:mem:restaurant;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# REST API only — avoids default OSIV session-for-request and startup WARN from JpaWebConfiguration
spring.jpa.open-in-view=false
